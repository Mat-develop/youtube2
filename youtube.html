<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css"
      rel="stylesheet"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="estilo.css" />
  </head>

  <body class="light">
    <header class="fill">
      <nav>
        <button class="circle transparent" data-ui="#menu">
          <i>menu</i>
        </button>

        <img src="youtube_logo_.png" class="logo" />

        <div class="field label suffix border round min center">
          <input type="text" />
          <label>Label</label>
          <i>search</i>
        </div>

        <button class="circle transparent right-align max">
          <img class="responsive" src="user.png" />
        </button>
      </nav>

      <div class="grid">
        <div class="s6">
          <div class="video">
            <img class="img-video" src="ferro.webp" alt="" />
            <p class="titulo-video">TRAILER CAP AMERICA 4K HD 1080P</p>
            <div class="caixa-user">
              <img src="user.png" class="logo1" alt="" />
              <div class="descricao-user">
                <p class="descricao-nome">titulo</p>
                <p class="descricao-inscritos">inscritos 34k</p>
              </div>
              <button class="botao-inscri">INSCREVER-SE</button>
            </div>
          </div>
        </div>

        <div class="s6">
          <div class="video">
            <img class="img-video" src="hulkzao.webp" alt="" />
            <p class="titulo-video">HULK TRAILER 4K HD 1080P</p>
            <div class="caixa-user">
              <img src="user.png" class="logo1" alt="" />
              <div class="descricao-user">
                <p class="descricao-nome">titulo</p>
                <p class="descricao-inscritos">inscritos 34k</p>
              </div>
              <button class="botao-inscri">INSCREVER-SE</button>
            </div>
          </div>
        </div>

        <div class="s6">
          <div class="video">
            <img class="img-video" src="ironman.webp" alt="" />
            <p class="titulo-video">TRAILER IRONMAN 4K HD 1080P</p>
            <div class="caixa-user">
              <img src="user.png" class="logo1" alt="" />
              <div class="descricao-user">
                <p class="descricao-nome">titulo</p>
                <p class="descricao-inscritos">inscritos 34k</p>
              </div>
              <button class="botao-inscri">INSCREVER-SE</button>
            </div>
          </div>
        </div>

        <div class="s6">
          <div class="video">
            <img class="img-video" src="heman.webp" alt="" />
            <p class="titulo-video">TRAILER HE-MAN 4K HD 1080P</p>
            <div class="caixa-user">
              <img src="user.png" class="logo1" alt="" />
              <div class="descricao-user">
                <p class="descricao-nome">titulo</p>
                <p class="descricao-inscritos">inscritos 34k</p>
              </div>
              <button class="botao-inscri">INSCREVER-SE</button>
            </div>
          </div>
        </div>
      </div>

      <!-- modal abaixo  -->
      <dialog class="left" id="menu">
        <header>
          <nav>
            <img class="circle large" src="heman.webp" />
            <img src="youtube_logo_.png" class="logo" />
            <button class="transparent circle large" data-ui="#menu">
              <i>close</i>
            </button>
          </nav>
        </header>
        <div class="space"></div>
        <ul class="list">
          <li class="wave round">
            <i class="fa-solid fa-house"></i>
            <span class="max">Inicio</span>
          </li>
          <li class="wave round">
            <i class="fa-brands fa-youtube"></i>
            <span>Shorts</span>
          </li>
          <li class="wave round">
            <i>favorite</i>
            <span>Inscrições</span>
          </li>
          <li class="wave round">
            <i class="fa-regular fa-user"></i>
            <span>Você</span>
          </li>
          <li class="wave round">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Histórico</span>
          </li>
        </ul>
      </dialog>
    </header>
  </body>
</html>
